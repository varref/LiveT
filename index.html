<head>

  <style>
    body {
      background-color: #000000;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }

    /* إخفاء الصفحة في البداية */
    body {
      opacity: 0;
      transition: opacity 1.5s ease;
    }
      
    .button-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      justify-content: center;
    }

    .button {
      display: inline-block;
      width: 150px;
      height: 150px;
      background: linear-gradient(145deg, #000, #000);
      border: 1.75px solid white;
      border-radius: 15px;
      text-align: center;
      padding: 10px;
      color: white;
      font-size: 14px;
      text-decoration: none;
      position: relative;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: transparent;
      transition: left 0.5s;
    }

    .button:hover::before {
      left: 100%;
    }

    .button:hover {
      transform: translateY(-5px) scale(1.02);
    }

    .button:active {
      transform: translateY(-2px) scale(0.98);
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
    }

    .button img {
      width: 70%;
      height: 70%;
      object-fit: cover;
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    .button:hover img {
      transform: scale(1.05);
    }

    .button-text {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.5px;
      line-height: 1.4;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    * {
      -webkit-tap-highlight-color: transparent;
    }

    @media screen and (orientation: landscape) {
      .button-container {
        grid-template-columns: repeat(4, 1fr);
      }
      .button {
        width: 120px;
        height: 120px;
      }
    }

    .home-button {
      position: fixed;
      bottom: 20px;
      right: -100px;
      background: linear-gradient(145deg, #000, #000);
      border: 3px solid white;
      color: white;
      border-radius: 50px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      font-size: 1em;
      font-weight: bold;
      animation: slideIn 1s ease-out forwards;
      z-index: 1000;
      transition: all 0.3s ease;
    }

    .home-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.5);
    }

    .home-button svg {
      width: 50px;
      height: 27px;
      fill: white;
      transition: fill 0.3s ease;
    }

    @keyframes slideIn {
      from {
        right: -100px;
        opacity: 0;
      }
      to {
        right: 20px;
        opacity: 1;
      }
    }

    .popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      backdrop-filter: blur(5px);
    }

    .popup-content {
      background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
      color: white;
      padding: 30px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      border: 2px solid #333;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      position: relative;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    .popup-content * {
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    @keyframes popupAppear {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .popup-content::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: #333;
      border-radius: 20px;
      z-index: -1;
    }

    .popup button {
      background: #2a2a2a;
      color: white;
      font-size: 16px;
      padding: 15px 25px;
      width: 180px;
      height: 60px;
      border: 2px solid #444;
      border-radius: 12px;
      cursor: pointer;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-weight: bold;
      transition: all 0.3s ease;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }

    .popup button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: transparent;
      transition: left 0.5s;
    }

    .popup button:hover::before {
      left: 100%;
    }

    .popup button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.4);
    }

    .popup button:active {
      transform: translateY(0);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    .popup-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: transparent;
      border: none;
      color: #888;
      font-size: 24px;
      cursor: pointer;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all 0.3s ease;
    }

    .popup-close:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }
  </style>

    function openPopup() {

    function closePopup(popupId) {
      document.getElementById(popupId).style.display = "none";
    }

    // Close popup when clicking outside
    window.onclick = function(event) {
      const popups = ['popup', 'popup2', 'popup3'];
      popups.forEach(popupId => {
        const popup = document.getElementById(popupId);
        if (event.target === popup) {
          popup.style.display = "none";
        }
      });
    }

    // Prevent default anchor behavior for popup buttons and protect popup content
    document.addEventListener('DOMContentLoaded', function() {
      const popupLinks = document.querySelectorAll('a[onclick*="Popup"]');
      popupLinks.forEach(link => {
        link.addEventListener('click', function(e) {
          e.preventDefault();
        });
      });

      // منع النسخ واليمين كليك في البوب أب
      document.querySelectorAll('.popup-content').forEach(popup => {
        popup.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          return false;
        });
          
        popup.addEventListener('copy', (e) => {
          e.preventDefault();
          return false;
        });
          
        popup.addEventListener('cut', (e) => {
          e.preventDefault();
          return false;
        });
      });
    });

    window.addEventListener("load", function () {
      document.body.style.opacity = "1";
